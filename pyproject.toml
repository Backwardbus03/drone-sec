[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-forensic-toolkit"
version = "1.0.0"
description = "Indigenous, modular digital forensic framework for UAV investigation"
authors = [{ name = "DFT Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
dft = "dft.cli:main"

[tool.setuptools.packages.find]
include = ["dft*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
